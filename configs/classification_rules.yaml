# Excel表格分类规则

# 企业运营类
enterprise_operations:
  keywords:
    - 销售
    - 营收
    - 利润
    - 成本
    - 费用
    - 库存
    - 订单
    - 客户
    - 产品
    - 员工
    - 绩效
    - KPI
    - 运营
    - 经营
  patterns:
    - ".*销售.*报表.*"
    - ".*营收.*统计.*"
    - ".*成本.*分析.*"
  structure_features:
    - 时间序列数据
    - 指标列（金额、数量、百分比）
    - 多维度汇总

# 财务报表类
financial_statements:
  keywords:
    - 资产负债表
    - 利润表
    - 现金流量表
    - 财务
    - 会计
    - 科目
    - 借方
    - 贷方
    - 净利润
    - 总资产
    - 负债
    - 所有者权益
    - 营业收入
    - 营业成本
  patterns:
    - ".*资产负债表.*"
    - ".*利润表.*"
    - ".*现金流量表.*"
    - ".*财务.*报表.*"
  structure_features:
    - 标准财务科目
    - 期间对比
    - 百分比计算
    - 合计行

# 政府预算类
government_budget:
  keywords:
    - 预算
    - 财政
    - 支出
    - 收入
    - 拨款
    - 资金
    - 项目
    - 部门
    - 预算执行
    - 预算调整
  patterns:
    - ".*预算.*表.*"
    - ".*财政.*预算.*"
    - ".*预算.*执行.*"
  structure_features:
    - 按部门分类
    - 预算与实际对比
    - 年度/季度数据
    - 政府科目体系

# 政府统计类
government_statistics:
  keywords:
    - 统计
    - 人口
    - GDP
    - CPI
    - 指数
    - 增长率
    - 同比
    - 环比
    - 数据
    - 指标
    - 调查
    - 普查
  patterns:
    - ".*统计.*年鉴.*"
    - ".*统计.*公报.*"
    - ".*GDP.*数据.*"
  structure_features:
    - 时间序列
    - 统计指标
    - 地区/行业分类
    - 增长率计算

# 人力资源类
human_resources:
  keywords:
    - 员工
    - 人员
    - 薪资
    - 工资
    - 考勤
    - 招聘
    - 培训
    - 绩效
    - 福利
    - 社保
    - 公积金
  patterns:
    - ".*员工.*表.*"
    - ".*薪资.*表.*"
    - ".*考勤.*表.*"
  structure_features:
    - 人员信息
    - 薪资结构
    - 考勤记录
    - 部门组织结构

# 库存管理类
inventory_management:
  keywords:
    - 库存
    - 仓库
    - 物料
    - 入库
    - 出库
    - 盘点
    - 库位
    - 批次
    - 安全库存
  patterns:
    - ".*库存.*表.*"
    - ".*物料.*表.*"
    - ".*盘点.*表.*"
  structure_features:
    - 物料编码
    - 数量字段
    - 库位信息
    - 进出记录

# 销售管理类
sales_management:
  keywords:
    - 销售
    - 客户
    - 订单
    - 合同
    - 回款
    - 发货
    - 报价
    - 业绩
    - 渠道
  patterns:
    - ".*销售.*订单.*"
    - ".*客户.*表.*"
    - ".*销售.*业绩.*"
  structure_features:
    - 客户信息
    - 订单明细
    - 金额计算
    - 时间跟踪